yunshan:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: yunshan_takeout
    username: root
    password: "1234"
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket-name
  redis:
    host: localhost
    port: 6379
    password:
    database: 10
  wechat:
    appid: your-wechat-appid
    secret: your-wechat-secret
    mchid : your-mchid
    mchSerialNo: your-mch-serial-no
    privateKeyFilePath: your-apiclient_key.pem-path
    apiV3Key: your-api-v3-key
    weChatPayCertFilePath: your-wechatpay-cert.pem-path
    notifyUrl: https://your-domain/notify/paySuccess
    refundNotifyUrl: https://your-domain/notify/refundSuccess
